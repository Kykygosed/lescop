.stat span{font-size:26px}.stat b{font-size:34px;line-height:1.1;display:block}.stat small{color:var(--mut)}
button{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:0;border-radius:11px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 14px var(--gl);transition:transform .15s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--gl)}button:active{transform:scale(.95)}
button.ghost{background:transparent;color:var(--bl);border:1px solid var(--ln);box-shadow:none}button.red{background:linear-gradient(135deg,#ff5d73,#d6293e);box-shadow:0 4px 14px #d6293e44}
:focus-visible{outline:3px solid #f5c518;outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:11px;background:var(--card);color:var(--tx);font:inherit;transition:box-shadow .2s,border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 4px var(--gl)}
label{display:block;margin-bottom:12px;font-weight:600;font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left}tr{transition:background .2s}tr:hover{background:var(--ln)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.mut{color:var(--mut);font-size:13px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;box-shadow:0 2px 10px var(--gl)}
.pi{border-radius:4px 4px 18px 4px;padding:18px;box-shadow:2px 6px 16px #0003;color:#222;white-space:pre-wrap;transition:transform .25s,box-shadow .25s}.pi img{max-width:100%;border-radius:8px;margin-top:8px}
.grid>.pi:nth-child(odd){transform:rotate(-1.2deg)}.grid>.pi:nth-child(even){transform:rotate(1.2deg)}.grid>.pi:hover{transform:rotate(0) scale(1.03);box-shadow:4px 14px 30px #0004}

.box{background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:24px;width:460px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px #0007;animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
#login{margin:12vh auto;width:370px;max-width:92vw;padding:30px;animation:pop .6s cubic-bezier(.2,1.2,.3,1);box-shadow:0 20px 70px var(--gl)}

.abs{background:#e5484d22!important;outline:2px solid #e5484d}

.mf{display:flex;flex-direction:column;gap:4px}.mf button{margin-bottom:12px}

.mi{display:flex;gap:10px;padding:12px;border-radius:12px;cursor:pointer;border-left:4px solid transparent;transition:.2s}.mi>div{min-width:0;flex:1}.mi:hover{background:var(--ln)}.mi.on{background:var(--ln);border-left-color:var(--bl)}
.mi.nl{border-left-color:#ff4d6d}.mi.nl b,.mi.nl .sj{font-weight:800}.sj{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{white-space:pre-wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--ln);animation:up .35s}.emp{text-align:center;padding:40px 10px}
@media(max-width:900px){.mail{grid-template-columns:1fr;height:auto}.mail>.card{height:auto;max-height:60vh}}
@media(max-width:760px){#app{flex-direction:column-reverse}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}aside small,aside .sp,.logo,aside h1{display:none}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.nt th{background:var(--ln);font-size:13px;color:var(--mut)}.nc{display:inline-block;margin:2px 6px 2px 0;padding:3px 10px;border-radius:99px;background:var(--ln);font-weight:700;transition:transform .15s}.nc:hover{transform:scale(1.1)}.nc small{color:var(--mut);font-weight:600}
.mo{display:inline-block;padding:3px 12px;border-radius:99px;min-width:62px;text-align:center}.tot td{font-size:16px;border-bottom:0}
.bd{position:relative;aspect-ratio:5/3;container-type:inline-size;background:#fff;background-image:radial-gradient(#cbd5e8 1px,transparent 1px);background-size:24px 24px;border-radius:18px;border:1px solid var(--ln);box-shadow:0 12px 44px var(--gl);overflow:hidden;color:#14213d;animation:pop .4s}
.bd svg{position:absolute;inset:0;width:100%;height:100%}.bd.ed{touch-action:none;cursor:crosshair;user-select:none}
.bi{position:absolute;white-space:pre-wrap;line-height:1.2;max-width:90%}img.bi{height:auto;border-radius:8px;box-shadow:0 4px 14px #0003}
a.bl{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;padding:6px 14px;border-radius:99px;font-size:max(12px,1.8cqw);text-decoration:none;font-weight:700;box-shadow:0 4px 14px #1d4ed855;white-space:nowrap}
.bd .hit{stroke:transparent;stroke-width:22;pointer-events:stroke}.tb{margin:14px 0}
.hd small{font-weight:600;color:var(--mut)}.hd.td,.hd.td small{color:var(--bl)}
.sl.ca{background:repeating-linear-gradient(135deg,#e5384d 0 12px,#c9283c 12px 24px);border:2px solid #ffffff66;color:#fff}
.sl.rt{background:#111827;border:2px dashed #f5c518;color:#fff}
.dj{padding:0;overflow:hidden}.dh{display:flex;align-items:center;gap:16px;padding:16px 18px;cursor:pointer}
.db{width:58px;height:62px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--gl);flex:none}
.dj.today .db{background:linear-gradient(135deg,#ff7a59,#ff3d71)}.db b{font-size:24px;line-height:1}.db span{font-size:12px}
.di{flex:1;min-width:0}.di .tag{margin:4px 6px 0 0;color:#fff}.ch{font-size:26px;color:var(--mut);transition:transform .25s}.dj.open .ch{transform:rotate(90deg)}
.dj:hover{box-shadow:0 10px 28px var(--gl)}.dd{padding:0 18px 16px;animation:up .3s}.dv{padding:10px 14px;margin-top:10px;background:var(--ln);border-radius:12px}.dv p{margin:6px 0 0;white-space:pre-wrap}
aside{overflow:auto}.gh{margin:12px 10px 2px;font-size:12px;opacity:.65;font-weight:700}.lk .dot{opacity:.3;pointer-events:none}
button:disabled{opacity:.4;pointer-events:none}
.lk button{opacity:.3;pointer-events:none}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBPq6Wfxzq02MfK69BFxHm9_FUjDGTmAcw",authDomain:"kykychat-24c7f.firebaseapp.com",databaseURL:"https://kykychat-24c7f-default-rtdb.firebaseio.com",projectId:"kykychat-24c7f",storageBucket:"kykychat-24c7f.firebasestorage.app",messagingSenderId:"342562811927",appId:"1:342562811927:web:0fed1e1f511c4fddcfec52"});
const db=firebase.database().ref('lescop');
let D={},WK=0,me=null,view='',S={},dirty=false,boot=false;
const $=s=>document.querySelector(s),L=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const push=(p,o)=>db.child(p).push(o),upd=(p,o)=>db.child(p).update(o),del=p=>db.child(p).remove();
const U=id=>(D.users||{})[id]||{nom:'(supprimé)'},users=t=>L(D.users).filter(u=>!t||u.type==t);
const cls=()=>L(D.classes),mats=()=>L(D.matieres),today=()=>iso(new Date());
const opts=(a,f=x=>x.id,l=x=>x.nom)=>a.map(x=>[f(x),l(x)]);
const COL={Rouge:'#e5484d',Jaune:'#f5c518',Bleu:'#3b82f6',Vert:'#30a46c'};
const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const ICO={tableau:'🖍️',accueil:'🏠',vs:'🛎️',msg:'✉️',classes:'🏫',mat:'📚',comptes:'👥',appel:'✅',edt:'🗓️',eval:'📝',cdt:'📓',sanc:'⚠️',devoirs:'🎒',notes:'📊'};
const MENU={admin:[['accueil','Accueil'],['vs','Vie scolaire'],['msg','Messagerie'],['classes','Classes'],['mat','Matières'],['comptes','Comptes']],
prof:[['appel','Appel'],['msg','Messagerie'],['edt','Emploi du temps'],['tableau','Tableau'],['eval','Évaluation'],['cdt','Cahier de textes'],['sanc','Sanctions']],
eleve:[['accueil','Accueil'],['devoirs','Devoirs'],['edt','Emploi du temps'],['tableau','Tableau'],['notes','Notes'],['msg','Messagerie'],['vs','Vie scolaire']]};
db.on('value',s=>{D=s.val()||{};if(!D.users&&!boot){boot=true;push('users',{login:'admin',pw:'admin',type:'admin',nom:'Administrateur'});return}
if(me&&D.users&&D.users[me.id])me={id:me.id,...D.users[me.id]};if($('#modal').style.display=='flex'||window.DRAW)dirty=true;else render()});
function closeM(){$('#modal').style.display='none';if(dirty){dirty=false;render()}}
function b64(f,max=700){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=u})}
function frm(title,fs,cb){const m=$('#modal');m.innerHTML=`<div class=box><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.t=='textarea'?`<textarea id=f_${f.k} rows=4>${e(f.v)}</textarea>`:f.t=='select'?`<select id=f_${f.k}>${f.o.map(([v,l])=>`<option value="${e(v)}" ${v==f.v?'selected':''}>${e(l)}</option>`).join('')}</select>`:f.t=='file'?`<input id=f_${f.k} type=file accept="image/*">`:`<input id=f_${f.k} type="${f.t||'text'}" value="${e(f.v)}">`}</label>`).join('')}<div class="row end"><button class=ghost onclick=closeM()>Annuler</button><button id=ok>Enregistrer</button></div></div>`;m.style.display='flex';
$('#ok').onclick=async()=>{const r={};for(const f of fs){const x=$('#f_'+f.k);r[f.k]=f.t=='file'?(x.files[0]?await b64(x.files[0],f.max):f.v||''):x.value}cb(r);closeM();toast('Enregistré ✓')}}
function login(){$('#app').innerHTML=`<div id=login class=card><h2>ENT Lescop</h2><label>Identifiant<input id=lg autocomplete=username></label><label>Mot de passe<input id=pw type=password autocomplete=current-password></label><button onclick=doLogin() style="width:100%">Se connecter</button><p id=err class=mut></p></div>`;$('#pw').addEventListener('keydown',k=>{if(k.key=='Enter')doLogin()});$('#lg').focus()}
function doLogin(){if(!D.users){$('#err').textContent='Connexion à la base en cours… réessaie dans une seconde.';return}const u=users().find(u=>u.login==$('#lg').value&&u.pw==$('#pw').value);if(!u){$('#err').textContent='Identifiant ou mot de passe incorrect.';return}me=u;view=MENU[u.type][0][0];try{localStorage.ent=u.id}catch(x){}render()}
function logout(){me=null;try{delete localStorage.ent}catch(x){}render()}
const nav=v=>{view=v;S={};WK=0;window.A=1;render()};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function render(){if(!me){try{if(localStorage.ent&&D.users&&D.users[localStorage.ent]){me={id:localStorage.ent,...D.users[localStorage.ent]};view=MENU[me.type][0][0]}}catch(x){}}
if(!me){if(!$('#login'))login();return}const V={accueil,vs,msg,classes,mat:matieres,comptes,appel,edt,eval:evals,cdt,sanc,devoirs,notes,tableau}[view];
const nu=L(D.msgs).filter(x=>mine(x.to)&&!x.lu&&!x['x_'+PK()]).length;
$('#app').innerHTML=`<main class="${window.A?'pg':''}">${V()}</main><aside><div class=logo>🎓</div><h1>ENT Lescop</h1><small>${e(me.nom)}<br>${me.type}</small>${sideMenu(nu)}<div class=sp></div><a onclick=logout()><i>↩</i>Déconnexion</a></aside>`;window.A=0;if(view=='tableau')bindBoard()}
const av=u=>u.photo?`<img class=av src="${u.photo}">`:`<span class=av>${e((u.nom||'?')[0])}</span>`;
/* ACCUEIL */
const PC={Jaune:'#fde68a',Rose:'#fbcfe8',Bleu:'#bfdbfe',Vert:'#bbf7d0'};
function accueil(){const p=L(D.postits).sort((a,b)=>b.ts-a.ts);const ad=me.type=='admin';
return`<div class="row" style="justify-content:space-between"><h2>Bonjour ${e((me.nom||'').split(' ')[0])} 👋</h2>${ad?`<button onclick="editPi()">+ Post-it</button>`:''}</div>${ad?stats():''}<div class=grid>${p.map(x=>`<div class=pi style="background:${PC[x.couleur]||PC.Jaune};font-size:${x.taille||16}px;font-weight:${x.style=='gras'?800:400};font-style:${x.style=='italique'?'italic':'normal'}">${e(x.txt)}${x.img?`<img src="${x.img}">`:''}${ad?`<div class="row" style="margin-top:10px"><button class=ghost onclick="editPi('${x.id}')">Modifier</button><button class=red onclick="del('postits/${x.id}')">×</button></div>`:''}</div>`).join('')||'<p class=mut>Aucune information pour le moment.</p>'}</div>`}
const stats=()=>`<div class="grid st">${[['🎒',users('eleve').length,'Élèves'],['👩‍🏫',users('prof').length,'Professeurs'],['🏫',cls().length,'Classes'],['🚫',L(D.vs).filter(v=>v.date==today()&&v.kind=='Absence').length,'Absents du jour']].map(([i,n,l])=>`<div class="card stat"><span>${i}</span><b>${n}</b><small>${l}</small></div>`).join('')}</div>`;
function editPi(id){const x=id?D.postits[id]:{};frm('Post-it',[{k:'txt',l:'Texte',t:'textarea',v:x.txt},{k:'couleur',l:'Couleur',t:'select',o:Object.keys(PC).map(c=>[c,c]),v:x.couleur},{k:'style',l:'Mise en forme',t:'select',o:[['normal','Normal'],['gras','Gras'],['italique','Italique']],v:x.style},{k:'taille',l:'Taille',t:'select',o:[[14,'Petit'],[16,'Normal'],[22,'Grand'],[30,'Très grand']],v:x.taille},{k:'img',l:'Image',t:'file',v:x.img,max:800}],r=>{r.taille=+r.taille;r.ts=x.ts||Date.now();id?upd('postits/'+id,r):push('postits',r)})}
/* COMPTES */
function comptes(){return`<div class=row style="justify-content:space-between"><h2>Comptes</h2><button onclick="editU()">+ Compte</button></div>${selBar()}<div class=card><table>${users().map(u=>`<tr><td>${u.type=='admin'?'':`<input type=checkbox style="width:20px;height:20px" ${S.sel?.[u.id]?'checked':''} onchange="S.sel=S.sel||{};S.sel['${u.id}']=this.checked;render()">`}</td><td>${av(u)}</td><td><b>${e(u.nom)}</b><br><span class=mut>${e(u.login)} / ${e(u.pw)}</span></td><td><span class=tag>${u.type}</span> ${u.type=='eleve'?e((D.classes?.[u.classe]||{}).nom||'sans classe'):''} ${u.lie&&D.users?.[u.lie]?`<span class=tag>🔗 ${e(U(u.lie).nom)}</span>`:''}</td><td class=row><button class=ghost onclick="editU('${u.id}')">Modifier</button><button class=red onclick="confirm('Supprimer ?')&&del('users/${u.id}')">×</button></td></tr>`).join('')}</table></div>`}
function selBar(){const k=Object.keys(S.sel||{}).filter(i=>S.sel[i]&&D.users?.[i]),ok=k.length==2&&k.map(i=>D.users[i].type).sort().join()=='eleve,prof';
return`<div class="card row"><b>${k.length} sélectionné(s)</b><button ${ok?'':'disabled'} onclick="mergeSel()">🔗 Fusionner</button><button class=ghost ${k.length?'':'disabled'} onclick="unlinkSel()">Dissocier</button><span class=mut>Coche un compte élève et un compte prof pour les fusionner.</span></div>`}
function linkAcc(a,b){[a,b].forEach(k=>{const o=D.users[k]?.lie;if(o&&o!=a&&o!=b&&D.users[o])upd('users/'+o,{lie:''})});upd('users/'+a,{lie:b});upd('users/'+b,{lie:a})}
function mergeSel(){const k=Object.keys(S.sel||{}).filter(i=>S.sel[i]&&D.users[i]);if(k.length!=2||k.map(i=>D.users[i].type).sort().join()!='eleve,prof'){toast('Choisis 1 élève et 1 prof');return}linkAcc(k[0],k[1]);S.sel={};toast('Comptes fusionnés ✓')}
function unlinkSel(){Object.keys(S.sel||{}).filter(i=>S.sel[i]&&D.users[i]).forEach(i=>{const o=D.users[i].lie;upd('users/'+i,{lie:''});if(o&&D.users[o])upd('users/'+o,{lie:''})});S.sel={};toast('Comptes dissociés')}
function editU(id){const x=id?D.users[id]:{type:'eleve'};frm(id?'Modifier le compte':'Nouveau compte',[{k:'nom',l:'Nom complet',v:x.nom},{k:'login',l:'Identifiant',v:x.login},{k:'pw',l:'Mot de passe',v:x.pw},{k:'type',l:'Type',t:'select',o:[['eleve','Élève'],['prof','Professeur'],['admin','Admin']],v:x.type},{k:'classe',l:'Classe (élèves)',t:'select',o:[['','—'],...opts(cls())],v:x.classe},{k:'lie',l:'Fusionner avec un compte (élève ↔ prof)',t:'select',o:[['','—'],...users().filter(u=>u.id!=id&&u.type!='admin').map(u=>[u.id,`${u.nom} (${u.type})`])],v:x.lie},{k:'photo',l:'Photo',t:'file',v:x.photo,max:200}],r=>{const old=id?D.users[id].lie:'';let lie=r.lie;const P=lie&&D.users[lie];if(!P||P.type==r.type||P.type=='admin'||r.type=='admin')lie='';r.lie=lie;
const k=id||push('users',r).key;if(id)upd('users/'+id,r);
if(old&&old!=lie&&D.users[old])upd('users/'+old,{lie:''});
if(lie){const o=D.users[lie].lie;if(o&&o!=k&&D.users[o])upd('users/'+o,{lie:''});upd('users/'+lie,{lie:k})}})}
/* MATIERES */
function matieres(){return`<div class=row style="justify-content:space-between"><h2>Matières</h2><button onclick="editM()">+ Matière</button></div><div class=grid>${mats().map(m=>`<div class=card style="border-left:8px solid ${m.couleur}"><b>${e(m.nom)}</b><div class=row style="margin-top:8px"><button class=ghost onclick="editM('${m.id}')">Modifier</button><button class=red onclick="del('matieres/${m.id}')">×</button></div></div>`).join('')}</div>`}
function editM(id){const x=id?D.matieres[id]:{couleur:'#3b82f6'};frm('Matière',[{k:'nom',l:'Nom',v:x.nom},{k:'couleur',l:'Couleur',t:'color',v:x.couleur}],r=>id?upd('matieres/'+id,r):push('matieres',r))}
/* CLASSES + EDT */
function classes(){const c=S.cl&&D.classes?.[S.cl];
if(c)return`<div class=row><button class=ghost onclick="S={};render()">← Classes</button><h2 style="margin:0">${e(c.nom)}</h2><button onclick="editSlot('${S.cl}')">+ Cours</button></div><p class=mut>${users('eleve').filter(u=>u.classe==S.cl).length} élève(s)</p>${edtHTML(L(c.edt),'admin',S.cl)}`;
return`<div class=row style="justify-content:space-between"><h2>Classes</h2><button onclick="frm('Nouvelle classe',[{k:'nom',l:'Nom de la classe'}],r=>push('classes',r))">+ Classe</button></div><div class=grid>${cls().map(c=>`<div class=card><b>${e(c.nom)}</b><p class=mut>${users('eleve').filter(u=>u.classe==c.id).length} élèves</p><div class=row><button onclick="S.cl='${c.id}';render()">Emploi du temps</button><button class=red onclick="confirm('Supprimer la classe ?')&&del('classes/${c.id}')">×</button></div></div>`).join('')}</div>`}
function editSlot(cid,sid){const x=sid?D.classes[cid].edt[sid]:{heure:'08:00',duree:60};frm('Cours',[{k:'jour',l:'Jour',t:'select',o:JOURS.map((j,i)=>[i,j]),v:x.jour},{k:'heure',l:'Heure',t:'time',v:x.heure},{k:'duree',l:'Durée (min)',t:'number',v:x.duree},{k:'matiere',l:'Matière',t:'select',o:opts(mats()),v:x.matiere},{k:'prof',l:'Professeur',t:'select',o:opts(users('prof')),v:x.prof},{k:'lieu',l:'Lieu / salle',v:x.lieu}],r=>{r.jour=+r.jour;r.duree=+r.duree;sid?upd(`classes/${cid}/edt/${sid}`,r):push(`classes/${cid}/edt`,r)})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monday(o){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d}
function profAbs(p,d){return L(D.absprofs).some(a=>a.prof==p&&a.du<=d&&d<=a.au)}
function edtHTML(sl,mode,cid,ex=[]){const h=['08','09','10','11','12','13','14','15','16','17','18'],mo=monday(WK),dd=JOURS.map((_,i)=>{const d=new Date(mo);d.setDate(d.getDate()+i);return d}),ds=dd.map(iso),tm=t=>{const [a,b]=(t||'8:00').split(':');return(+a-8)*60+ +b};
const nv=`<div class=row style="margin-bottom:12px"><button class=ghost onclick="WK--;render()">‹</button><b>Semaine du ${dd[0].toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</b><button class=ghost onclick="WK++;render()">›</button>${WK?`<button class=ghost onclick="WK=0;render()">Aujourd'hui</button>`:''}</div>`;
return nv+`<div class=card style="overflow:auto"><div class=edt style="min-width:820px"><div></div>${JOURS.map((j,i)=>`<div class="hd ${ds[i]==today()?'td':''}">${j}<br><small>${dd[i].getDate()}/${dd[i].getMonth()+1}</small></div>`).join('')}<div>${h.map(x=>`<div class=hr>${x}h</div>`).join('')}</div>${JOURS.map((j,d)=>`<div class=col>${sl.filter(s=>s.jour==d).map(s=>{const m=D.matieres?.[s.matiere]||{nom:'?',couleur:'#888'},ca=profAbs(s.prof,ds[d]),rp=ca&&D.remps?.[s.id+'_'+ds[d]],rm=rp&&(D.matieres?.[rp.matiere]||{nom:'?',couleur:'#888'});
return`<div class="sl ${ca&&!rp?'ca':''}" style="top:${tm(s.heure)}px;height:${s.duree}px;${ca&&!rp?'':'background:'+(rp?rm.couleur:m.couleur)}" ${mode=='admin'?`onclick="${ca?`replaceCours('${cid}','${s.id}','${ds[d]}')`:`slotMenu('${cid}','${s.id}')`}"`:''}>${rp?`<b>↻ ${e(rm.nom)}</b><br>Remplacement · ${s.heure}<br>${e(rp.lieu||'')} · ${e(U(rp.prof).nom)}<br><small>à la place de ${e(m.nom)}</small>`:`<b>${e(m.nom)}</b><br>${ca?'Cours annulé · prof absent'+(mode=='admin'?'<br><small>Clique pour remplacer</small>':''):`${s.heure} · ${e(s.lieu||'')}<br>${e(U(s.prof).nom)}${s.cls?' · '+e(s.cls):''}`}`}</div>`}).join('')}${ex.filter(x=>x.date==ds[d]).map(x=>`<div class="sl ${x.html?'':'rt'}" style="top:${tm(x.heure)}px;height:${x.duree}px${x.bg?';background:'+x.bg:''}">${x.html||`<b>⛔ Retenue</b><br>${x.heure} · ${x.duree} min<br>${e(x.motif||'')}`}</div>`).join('')}</div>`).join('')}</div></div>`}
function replaceCours(cid,sid,date){const s=D.classes[cid].edt[sid],k=sid+'_'+date,r=D.remps?.[k];
frm(r?'Modifier le remplacement':'Remplacer le cours annulé',[{k:'matiere',l:'Nouvelle matière',t:'select',o:opts(mats()),v:r?r.matiere:s.matiere},{k:'prof',l:'Professeur remplaçant',t:'select',o:opts(users('prof').filter(p=>p.id!=s.prof)),v:r?.prof},{k:'lieu',l:'Lieu',v:r?r.lieu:s.lieu},{k:'act',l:'Action',t:'select',o:[['0','Enregistrer le remplacement'],['1','Supprimer le remplacement']],v:'0'}],q=>{if(q.act=='1'){del('remps/'+k);return}if(!q.prof){toast('Choisis un professeur');return}db.child('remps/'+k).set({classe:cid,slot:sid,date,matiere:q.matiere,prof:q.prof,lieu:q.lieu})})}
function slotMenu(c,s){frm('Cours',[{k:'a',l:'Action',t:'select',o:[['m','Modifier'],['d','Supprimer']]}],r=>{if(r.a=='d')del(`classes/${c}/edt/${s}`);else setTimeout(()=>editSlot(c,s),50)})}
function edt(){let sl,ex=[];if(me.type=='prof'){sl=[];cls().forEach(c=>L(c.edt).forEach(s=>s.prof==me.id&&sl.push({...s,cls:c.nom})));L(D.remps).forEach(r=>{const o=D.classes?.[r.classe]?.edt?.[r.slot];if(r.prof==me.id&&o&&profAbs(o.prof,r.date)){const m=D.matieres?.[r.matiere]||{nom:'?',couleur:'#888'};ex.push({date:r.date,heure:o.heure,duree:+o.duree,bg:m.couleur,html:`<b>↻ ${e(m.nom)}</b><br>Remplacement · ${o.heure}<br>${e(r.lieu||'')} · ${e(D.classes[r.classe].nom)}`})}})}else{sl=L(D.classes?.[me.classe]?.edt);ex=L(D.vs).filter(v=>v.eleve==me.id&&v.kind=='Retenue'&&v.heure).map(v=>({date:v.date,heure:v.heure,duree:+v.duree||60,motif:v.motif}))}
return`<h2>Emploi du temps</h2>${sl.length||ex.length?edtHTML(sl,0,0,ex):'<p class=mut>Aucun cours programmé.</p>'}`}
/* VIE SCOLAIRE */
const KIND=['Absence','Retard','Avertissement','Retenue'];
function billet(kinds){const el=users('eleve');frm('Nouveau billet',[{k:'eleve',l:'Élève',t:'select',o:opts(el)},{k:'kind',l:'Type',t:'select',o:kinds.map(k=>[k,k])},{k:'date',l:'Date (retenue ou événement)',t:'date',v:today()},{k:'heure',l:'Heure (retenue)',t:'time',v:'16:00'},{k:'duree',l:'Durée en minutes (retenue)',t:'number',v:60},{k:'motif',l:'Motif',t:'textarea'}],r=>{r.auteur=me.id;if(r.kind=='Retenue')r.duree=+r.duree||60;else{delete r.heure;delete r.duree}push('vs',r)})}
function vsList(a,own){return`<div class=card><table>${a.map(v=>`<tr><td>${v.date}</td>${own?'':`<td>${e(U(v.eleve).nom)}</td>`}<td><span class=tag style="${v.kind=='Absence'||v.kind=='Retenue'?'background:#e5484d33':v.kind=='Retard'?'background:#f5c51855':''}">${v.kind}</span>${v.heure?`<br><span class=mut>${v.heure} · ${v.duree} min</span>`:''}</td><td>${e(v.motif||'')}<br><span class=mut>par ${e(U(v.auteur).nom)}</span></td>${me.type=='admin'?`<td><button class=red onclick="del('vs/${v.id}')">×</button></td>`:''}</tr>`).join('')||'<tr><td class=mut>Rien à signaler.</td></tr>'}</table></div>`}
function vs(){const a=L(D.vs).sort((x,y)=>y.date>x.date?1:-1);
if(me.type=='eleve')return`<h2>Vie scolaire</h2>${vsList(a.filter(v=>v.eleve==me.id),1)}`;
const ab=a.filter(v=>v.date==today()&&v.kind=='Absence');
return`<div class=row style="justify-content:space-between"><h2>Vie scolaire</h2><button onclick="billet(KIND)">+ Billet / sanction</button></div><h3>Professeurs absents</h3><div class=row style="margin-bottom:10px"><button onclick="absProf()">+ Déclarer un prof absent</button></div>${absList()}<h3>Élèves absents aujourd'hui (${ab.length})</h3>${vsList(ab)}<h3>Historique</h3>${vsList(a)}`}
function absList(){const l=L(D.absprofs).sort((a,b)=>b.du>a.du?1:-1);return`<div class=card><table>${l.map(a=>`<tr><td><b>${e(U(a.prof).nom)}</b></td><td>du ${a.du} au ${a.au}</td><td>${e(a.motif||'')}</td><td><button class=red onclick="del('absprofs/${a.id}')">×</button></td></tr>`).join('')||'<tr><td class=mut>Aucun professeur absent.</td></tr>'}</table></div>`}
function absProf(){frm('Professeur absent',[{k:'prof',l:'Professeur',t:'select',o:opts(users('prof'))},{k:'du',l:'Du',t:'date',v:today()},{k:'au',l:'Au (inclus)',t:'date',v:today()},{k:'motif',l:'Motif',t:'textarea'}],r=>{if(r.au<r.du)r.au=r.du;push('absprofs',r)})}
function mine(id){return id==me.id||(!!me.lie&&id==me.lie)}
function PK(){return[me.id,me.lie].filter(Boolean).sort()[0]}
function go(uid,v){me={id:uid,...D.users[uid]};view=v;S={};WK=0;window.A=1;render()}
function sideMenu(nu){const o=me.lie&&D.users?.[me.lie]&&D.users[me.lie].type!='admin'?{id:me.lie,...D.users[me.lie]}:null;
const it=(u,own)=>MENU[u.type].filter(([k])=>own||k!='msg').map(([k,l])=>`<a tabindex=0 class="${own&&k==view?'on':''}" onclick="${own?`nav('${k}')`:`go('${u.id}','${k}')`}"><i>${ICO[k]}</i>${l}${own&&k=='msg'&&nu?`<b class=bd>${nu}</b>`:''}</a>`).join('');
const T={eleve:'Espace élève',prof:'Espace professeur',admin:'Administration'};
if(!o)return it(me,1);
return[[me,1],[o,0]].sort((a,b)=>(a[0].type=='eleve'?0:1)-(b[0].type=='eleve'?0:1)).map(([u,own])=>`<div class=gh>${T[u.type]}</div>${it(u,own)}`).join('')}
function inCours(c){if(me.type!='prof'||profAbs(me.id,today()))return null;const n=new Date(),d=(n.getDay()+6)%7,m=n.getHours()*60+n.getMinutes();
return L(D.classes?.[c]?.edt).find(s=>{const[a,b]=(s.heure||'0:0').split(':'),st=+a*60+ +b;return s.prof==me.id&&s.jour==d&&m>=st&&m<st+(+s.duree||0)})||null}
function endT(s){const[a,b]=s.heure.split(':'),t=+a*60+ +b+ +s.duree;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function neBtn(x,u,v){return`<button class="${v=='NE'?'':'ghost'}" style="padding:4px 10px;font-size:12px" onclick="setNote('${x.id}','${u.id}',${v=='NE'?'null':"'NE'"})">Non évalué</button>`}
function setNote(ev,uid,val){if(!D.evals[ev]||!inCours(D.evals[ev].classe)){toast('Notation verrouillée : tu n\'es pas en cours');render();return}upd('evals/'+ev+'/notes',{[uid]:val})}
setInterval(()=>{if(me&&view=='eval'&&$('#modal').style.display!='flex'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()},30000);
function sanc(){return`<div class=row style="justify-content:space-between"><h2>Sanctions</h2><button onclick="billet(['Avertissement','Retenue'])">+ Sanction</button></div>${vsList(L(D.vs).filter(v=>v.auteur==me.id&&/Aver|Rete/.test(v.kind)))}`}
/* APPEL */
function appel(){const c=S.ac,el=users('eleve').filter(u=>u.classe==c);S.abs=S.abs||{};
return`<h2>Appel</h2><label style="max-width:300px">Classe<select onchange="S.ac=this.value;S.abs={};render()"><option value="">—</option>${cls().map(x=>`<option value="${x.id}" ${x.id==c?'selected':''}>${e(x.nom)}</option>`).join('')}</select></label>
<div class=grid>${el.map(u=>`<div class="card row ${S.abs[u.id]?'abs':''}" style="cursor:pointer" onclick="S.abs['${u.id}']=!S.abs['${u.id}'];render()">${av(u)}<b>${e(u.nom)}</b><span class=mut>${S.abs[u.id]?'Absent':'Présent'}</span></div>`).join('')}</div>
${c?`<button onclick="sendAppel()">Valider l'appel (${Object.values(S.abs).filter(Boolean).length} absent·s)</button>`:''}`}
function sendAppel(){const a=Object.keys(S.abs).filter(k=>S.abs[k]);a.forEach(id=>push('vs',{eleve:id,kind:'Absence',date:today(),motif:'Signalé à l\'appel',auteur:me.id}));S.abs={};toast('Appel envoyé en vie scolaire ✓');render()}
/* MESSAGERIE */
function msg(){S.f=S.f||'in';const all=L(D.msgs).sort((a,b)=>b.ts-a.ts).filter(x=>!x['x_'+PK()]&&(mine(x.to)||mine(x.from)));
const inb=all.filter(x=>mine(x.to)),out=all.filter(x=>mine(x.from)),nu=inb.filter(x=>!x.lu).length;
const box=S.f=='out'?out:S.f=='un'?inb.filter(x=>!x.lu):inb,cur=all.find(x=>x.id==S.m);
const fd=(k,i,l,n)=>`<a class="${S.f==k?'on':''}" onclick="S.f='${k}';S.m=null;render()"><i>${i}</i>${l}${n?`<b class=bd>${n}</b>`:''}</a>`;
const when=t=>{const d=new Date(t);return d.toDateString()==new Date().toDateString()?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
return`<h2>Messagerie</h2><div class=mail><div class="mf card"><button onclick="newMsg()">✏️ Écrire</button>${fd('in','📥','Réception',nu)}${fd('un','🔵','Non lus',0)}${fd('out','📤','Envoyés',0)}</div>
<div class="ml card">${box.map(x=>{const o=S.f=='out',u=U(o?x.to:x.from);return`<div class="mi ${x.id==S.m?'on':''} ${!o&&!x.lu?'nl':''}" onclick="openMsg('${x.id}')">${av(u)}<div><div class=row style="justify-content:space-between;flex-wrap:nowrap"><b>${e(o?'À : '+u.nom:u.nom)}</b><span class=mut>${when(x.ts)}</span></div><div class=sj>${e(x.sujet)}</div><div class="mut pv">${e((x.txt||'').slice(0,70))}</div></div></div>`}).join('')||'<p class="mut emp">📭 Rien ici pour le moment.</p>'}</div>
<div class="mv card">${cur?`<div class=row style="justify-content:space-between"><h3>${e(cur.sujet)}</h3><div class=row><button class=ghost onclick="replyMsg('${cur.id}')">↩ Répondre</button><button class=red onclick="delMsg('${cur.id}')">🗑</button></div></div><div class=row>${av(U(cur.from))}<div><b>${e(U(cur.from).nom)}</b> <span class=tag>${U(cur.from).type||''}</span><div class=mut>à ${e(U(cur.to).nom)} · ${new Date(cur.ts).toLocaleString('fr-FR')}</div></div></div><div class=mb>${e(cur.txt)}</div>`:'<p class="mut emp">✉️ Choisis un message pour le lire.</p>'}</div></div>`}
function openMsg(id){S.m=id;const x=D.msgs[id];if(x&&mine(x.to)&&!x.lu)upd('msgs/'+id,{lu:true});render()}
function delMsg(id){S.m=null;upd('msgs/'+id,{['x_'+PK()]:true});toast('Message supprimé')}
function replyMsg(id){const x=D.msgs[id];newMsg(x.from,/^Re:/.test(x.sujet)?x.sujet:'Re: '+x.sujet,'\n\n— '+U(x.from).nom+' a écrit :\n'+x.txt.split('\n').map(l=>'> '+l).join('\n'))}
function newMsg(to,sujet,txt){frm(to?'Répondre':'Nouveau message',[{k:'to',l:'À',t:'select',o:users().filter(u=>!mine(u.id)).map(u=>[u.id,`${u.nom} (${u.type})`]),v:to},{k:'sujet',l:'Objet',v:sujet},{k:'txt',l:'Message',t:'textarea',v:txt}],r=>{r.from=me.id;r.ts=Date.now();r.lu=false;push('msgs',r);S.f='out'})}
/* EVALUATION */
function evals(){const c=S.ec,cu=c&&inCours(c),lk=!cu,el=users('eleve').filter(u=>u.classe==c),ev=L(D.evals).filter(x=>x.classe==c&&x.prof==me.id);
return`<div class=row style="justify-content:space-between"><h2>Évaluation</h2>${c?`<button onclick="newEval()">+ Évaluation</button>`:''}</div><label style="max-width:300px">Classe<select onchange="S.ec=this.value;render()"><option value="">—</option>${cls().map(x=>`<option value="${x.id}" ${x.id==c?'selected':''}>${e(x.nom)}</option>`).join('')}</select></label>
${c?(cu?`<div class=card style="border-left:6px solid #30a46c">🟢 Tu es en cours avec cette classe : notation ouverte jusqu'à ${endT(cu)}.</div>`:`<div class=card style="border-left:6px solid #e5484d">🔒 Tu ne peux noter que pendant ton cours avec cette classe.</div>`):''}${ev.map(x=>`<div class=card><div class=row style="justify-content:space-between"><h3>${e(x.titre)} <span class=mut>${e((D.matieres?.[x.matiere]||{}).nom||'')} · ${e(x.comp||'')} · coef ${x.coef}${x.mode=='note'?' · /'+x.sur:''}</span></h3><button class=red onclick="del('evals/${x.id}')">×</button></div><table class="${lk?'lk':''}">${el.map(u=>{const v=(x.notes||{})[u.id];return`<tr><td>${e(u.nom)}</td><td>${x.mode=='note'?`<input type=number step=.25 style="width:90px" ${lk?'disabled':''} value="${v==='NE'?'':v??''}" onchange="setNote('${x.id}','${u.id}',this.value===''?null:+this.value)"> / ${x.sur} ${neBtn(x,u,v)}`:Object.entries(COL).map(([n,h])=>`<span class="dot ${v==n?'s':''}" title="${n}" style="background:${h}" onclick="setNote('${x.id}','${u.id}','${n}')"></span>`).join(' ')} ${neBtn(x,u,v)}</td></tr>`}).join('')}</table></div>`).join('')}`}
function newEval(){frm('Nouvelle évaluation',[{k:'titre',l:'Titre'},{k:'matiere',l:'Matière',t:'select',o:opts(mats())},{k:'comp',l:'Compétence évaluée'},{k:'mode',l:'Notation',t:'select',o:[['note','Note chiffrée'],['couleur','Couleurs (Rouge/Jaune/Bleu/Vert)']]},{k:'sur',l:'Sur (si note)',t:'number',v:20},{k:'coef',l:'Coefficient',t:'number',v:1}],r=>{r.sur=+r.sur||20;r.coef=+r.coef||1;r.classe=S.ec;r.prof=me.id;push('evals',r)})}
/* CAHIER DE TEXTES / DEVOIRS */
function cdt(){const d=L(D.devoirs).filter(x=>x.prof==me.id).sort((a,b)=>b.date>a.date?1:-1);
return`<div class=row style="justify-content:space-between"><h2>Cahier de textes</h2><button onclick="newDev()">+ Devoir</button></div>${d.map(x=>`<div class=card><div class=row style="justify-content:space-between"><b>${e((D.classes?.[x.classe]||{}).nom)} · ${e((D.matieres?.[x.matiere]||{}).nom)} · pour le ${x.date}</b><button class=red onclick="del('devoirs/${x.id}')">×</button></div><p style="white-space:pre-wrap">${e(x.txt)}</p></div>`).join('')||'<p class=mut>Aucun devoir.</p>'}`}
function newDev(){frm('Nouveau devoir',[{k:'classe',l:'Classe',t:'select',o:opts(cls())},{k:'matiere',l:'Matière',t:'select',o:opts(mats())},{k:'date',l:'Pour le',t:'date',v:today()},{k:'txt',l:'Travail à faire',t:'textarea'}],r=>{r.prof=me.id;push('devoirs',r)})}
function devoirs(){const t=today(),by={};L(D.devoirs).filter(x=>x.classe==me.classe).forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
const days=Object.keys(by).filter(d=>S.past?d<t:d>=t).sort((x,y)=>S.past?(x<y?1:-1):(x>y?1:-1)),M=id=>D.matieres?.[id]||{nom:'?',couleur:'#888'};
const lab=d=>{const n=Math.round((new Date(d+'T12:00')-new Date(t+'T12:00'))/864e5);return n==0?"Aujourd'hui":n==1?'Demain':new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})};
return`<div class=row style="justify-content:space-between"><h2>Devoirs</h2><button class=ghost onclick="S.past=!S.past;S.dj=null;render()">${S.past?'À venir':'Jours passés'}</button></div>${days.map(d=>{const dt=new Date(d+'T12:00'),o=S.dj==d,ms=[...new Set(by[d].map(x=>x.matiere))];
return`<div class="card dj ${o?'open':''} ${d==t?'today':''}"><div class=dh onclick="S.dj=S.dj=='${d}'?null:'${d}';render()"><div class=db><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('fr-FR',{month:'short'})}</span></div><div class=di><b>${e(lab(d))}</b><div>${ms.map(m=>`<span class=tag style="background:${M(m).couleur}">${e(M(m).nom)}</span>`).join('')}</div></div><span class=ch>›</span></div>${o?`<div class=dd>${by[d].map(x=>`<div class=dv style="border-left:6px solid ${M(x.matiere).couleur}"><b>${e(M(x.matiere).nom)}</b> <span class=mut>${e(U(x.prof).nom)}</span><p>${e(x.txt)}</p></div>`).join('')}</div>`:''}</div>`}).join('')||`<p class="mut emp">${S.past?'Aucun devoir passé.':'Aucun devoir à venir 🎉'}</p>`}`}
/* NOTES */
function notes(){const ev=L(D.evals).filter(x=>x.classe==me.classe),by={};
ev.forEach(x=>{const v=(x.notes||{})[me.id];if(v==null)return;const o=by[x.matiere]=by[x.matiere]||{n:0,c:0,l:[]};o.l.push([x,v]);if(x.mode=='note'&&v!=='NE'){o.n+=v/x.sur*20*x.coef;o.c+=x.coef}});
const mo=m=>{const c=m<8?COL.Rouge:m<12?COL.Jaune:m<15?COL.Bleu:COL.Vert;return`<b class=mo style="background:${c};color:${c==COL.Jaune?'#222':'#fff'}">${m.toFixed(2)}</b>`};
const rows=Object.entries(by).map(([id,o])=>({M:D.matieres?.[id]||{nom:'?',couleur:'#888'},o,m:o.c?o.n/o.c:null})),ok=rows.filter(r=>r.m!=null),g=ok.length?ok.reduce((a,r)=>a+r.m,0)/ok.length:null;
return`<h2>Notes</h2><div class=card style="padding:0;overflow:auto"><table class=nt><thead><tr><th>Matière</th><th>Notes</th><th>Moyenne</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="border-left:8px solid ${r.M.couleur}"><b>${e(r.M.nom)}</b></td><td>${r.o.l.map(([x,v])=>v==='NE'?`<span class=nc title="${e(x.titre)} · non évalué" style="opacity:.6">NE</span>`:x.mode=='note'?`<span class=nc title="${e(x.titre+' · '+(x.comp||'')+' · coef '+x.coef)}">${v}<small>/${x.sur}</small></span>`:`<span class=dot style="background:${COL[v]}" title="${e(x.titre)}"></span>`).join('')}</td><td>${r.m!=null?mo(r.m):'—'}</td></tr>`).join('')||'<tr><td colspan=3 class=mut>Aucune note pour le moment.</td></tr>'}<tr class=tot><td><b>Moyenne générale</b></td><td></td><td>${g!=null?mo(g):'—'}</td></tr></tbody></table></div>`}
/* TABLEAU */
function tableau(){const ps=me.type=='prof',b=S.tb&&D.tableaux?.[S.tb];
if(b)return`<div class=row><button class=ghost onclick="S.tb=null;render()">← Tableaux</button><h2 style="margin:0">${e(b.titre)}</h2><span class=mut>${e((D.classes?.[b.classe]||{}).nom)} · ${e((D.matieres?.[b.matiere]||{}).nom)}</span></div>${ps?toolbar():'<p class=mut>Le professeur peut modifier ce tableau en direct.</p>'}${boardHTML(b,ps)}`;
const l=L(D.tableaux).filter(x=>ps?x.prof==me.id:x.classe==me.classe).sort((a,c)=>c.ts-a.ts);
return`<div class=row style="justify-content:space-between"><h2>Tableau</h2>${ps?`<button onclick="newTb()">+ Nouveau tableau</button>`:''}</div><div class=grid>${l.map(x=>{const m=D.matieres?.[x.matiere]||{nom:'?',couleur:'#888'};return`<div class=card style="border-left:8px solid ${m.couleur};cursor:pointer" onclick="S.tb='${x.id}';S.tool='pen';render()"><b>${e(x.titre)}</b><div class=mut>${e(m.nom)} · ${ps?e((D.classes?.[x.classe]||{}).nom):e(U(x.prof).nom)}<br>${new Date(x.ts).toLocaleDateString('fr-FR')}</div>${ps?`<button class=red style="margin-top:8px" onclick="event.stopPropagation();confirm('Supprimer ce tableau ?')&&del('tableaux/${x.id}')">×</button>`:''}</div>`}).join('')||'<p class=mut>Aucun tableau pour le moment.</p>'}</div>`}
function newTb(){frm('Nouveau tableau',[{k:'titre',l:'Titre',v:''},{k:'classe',l:'Classe',t:'select',o:opts(cls())},{k:'matiere',l:'Matière',t:'select',o:opts(mats())}],r=>{r.prof=me.id;r.ts=Date.now();S.tb=push('tableaux',r).key;S.tool='pen'})}
function boardHTML(b,ed){const it=L(b.items).sort((x,y)=>x.ts-y.ts),ok=u=>/^https?:/i.test(u)?u:'#';
return`<div class="bd ${ed?'ed':''}" id=bd><svg viewBox="0 0 1000 600" preserveAspectRatio=none>${it.filter(x=>x.t=='s').map(x=>`<g data-id="${x.id}"><polyline fill=none stroke="${e(x.c)}" stroke-width="${+x.w}" stroke-linecap=round stroke-linejoin=round points="${e(x.p)}"/>${ed?`<polyline class=hit fill=none points="${e(x.p)}"/>`:''}</g>`).join('')}</svg>${it.filter(x=>x.t!='s').map(x=>{const st=`left:${x.x/10}%;top:${x.y/6}%`;
return x.t=='t'?`<div class=bi data-id="${x.id}" style="${st};color:${e(x.c)};font-size:${+x.sz/10}cqw">${e(x.txt)}</div>`:x.t=='i'?`<img class=bi data-id="${x.id}" style="${st};width:${+x.w/10}%" src="${e(x.src)}">`:`<a class="bi bl" data-id="${x.id}" style="${st}" href="${e(ok(x.url))}" target=_blank rel=noopener>🔗 ${e(x.txt||x.url)}</a>`}).join('')}</div>`}
function toolbar(){const T=[['pen','✏️','Crayon'],['t','🔤','Texte'],['i','🖼️','Image'],['l','🔗','Lien'],['er','🧽','Gomme']];S.col=S.col||'#14213d';S.w=S.w||4;
return`<div class="card row tb">${T.map(([k,i,l])=>`<button class="${S.tool==k?'':'ghost'}" onclick="S.tool='${k}';render()">${i} ${l}</button>`).join('')}<input type=color value="${S.col}" style="width:48px;padding:2px" onchange="S.col=this.value"><select style="width:80px" onchange="S.w=+this.value">${[2,4,8,14].map(w=>`<option ${w==S.w?'selected':''}>${w}</option>`).join('')}</select><button class=ghost onclick="undoTb()">↩ Annuler</button><button class=ghost onclick="confirm('Tout effacer ?')&&del('tableaux/'+S.tb+'/items')">🗑 Tout effacer</button></div>`}
function undoTb(){const l=L(D.tableaux?.[S.tb]?.items).sort((a,b)=>b.ts-a.ts);if(l[0])del('tableaux/'+S.tb+'/items/'+l[0].id)}
function bindBoard(){const b=$('#bd');if(!b||me.type!='prof'||!S.tb)return;const P='tableaux/'+S.tb+'/items';let pts=null,tmp=null;
const pt=ev=>{const r=b.getBoundingClientRect();return[Math.round((ev.clientX-r.left)/r.width*1000),Math.round((ev.clientY-r.top)/r.height*600)]};
b.onpointerdown=ev=>{const t=S.tool,[x,y]=pt(ev),it=ev.target.closest('[data-id]'),ts=Date.now();
if(t=='er'){if(it)del(P+'/'+it.dataset.id);return}
if(t=='pen'){ev.preventDefault();b.setPointerCapture(ev.pointerId);window.DRAW=1;pts=[[x,y]];tmp=document.createElementNS('http://www.w3.org/2000/svg','polyline');tmp.setAttribute('fill','none');tmp.setAttribute('stroke',S.col);tmp.setAttribute('stroke-width',S.w);tmp.setAttribute('stroke-linecap','round');b.querySelector('svg').appendChild(tmp);return}
if(it)return;
if(t=='t')frm('Texte',[{k:'txt',l:'Texte',t:'textarea'},{k:'sz',l:'Taille',t:'select',o:[[20,'Petit'],[32,'Moyen'],[52,'Grand'],[80,'Très grand']],v:32}],r=>r.txt&&push(P,{t:'t',x,y,txt:r.txt,sz:+r.sz,c:S.col,ts}));
if(t=='i')frm('Image',[{k:'src',l:'Image',t:'file',max:900},{k:'w',l:'Largeur',t:'select',o:[[200,'Petite'],[350,'Moyenne'],[550,'Grande']],v:350}],r=>r.src&&push(P,{t:'i',x,y,w:+r.w,src:r.src,ts}));
if(t=='l')frm('Lien',[{k:'url',l:'Adresse du lien',v:'https://'},{k:'txt',l:'Texte affiché',v:''}],r=>r.url&&push(P,{t:'l',x,y,url:/^https?:\/\//i.test(r.url)?r.url:'https://'+r.url,txt:r.txt,ts}))};
b.onpointermove=ev=>{if(!pts)return;const q=pt(ev),l=pts[pts.length-1];if(Math.abs(q[0]-l[0])+Math.abs(q[1]-l[1])<3)return;pts.push(q);tmp.setAttribute('points',pts.map(p=>p.join(',')).join(' '))};
b.onpointerup=b.onpointercancel=()=>{if(!pts)return;const p=pts;pts=null;window.DRAW=0;if(p.length==1)p.push([p[0][0]+1,p[0][1]]);push(P,{t:'s',c:S.col,w:S.w,p:p.map(q=>q.join(',')).join(' '),ts:Date.now()})}}
render();
</script></body></html>
